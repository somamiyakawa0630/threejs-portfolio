<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three.js Portfolio</title>
    <link rel="stylesheet" href="./src/style.css">
    <style>
      /* ローディング画面のスタイル */
     
    </style>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>

    <div id="loading-screen">
      <div class="loading-text">loading...</div>
    </div>

    <header id="main-header">
      <nav class="header-nav">
        <button class="nav-btn" id="btn-about" onclick="window.portfolioUI?.goToDesktop()">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span class="btn-label">About Me</span>
        </button>

        <button class="nav-btn" id="btn-arcade" onclick="window.portfolioUI?.goToArcade()">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="6" width="20" height="12" rx="3"/>
              <path d="M12 12h.01M8 12h.01M16 12h.01M12 8v8"/>
            </svg>
          </span>
          <span class="btn-label">Arcade Game</span>
        </button>

        <button class="nav-btn light-btn" id="btn-light" onclick="window.portfolioUI?.toggleLight()">
          <span class="btn-icon">
            <svg id="icon-light-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6M10 22h4"/>
            </svg>
            <svg id="icon-light-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6M10 22h4"/>
              <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </span>
          <span class="btn-label" id="light-label">Light: ON</span>
        </button>
      </nav>
    </header>

    <canvas id="myCanvas"></canvas>
  </body>
</html>
